<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contador TV</title><style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:#560080;color:#fff;display:grid;place-items:center;font-family:Arial}.screen{text-align:center;width:100%;padding:4vw}.label{font-size:clamp(18px,2.3vw,42px);font-weight:900;letter-spacing:.18em;text-transform:uppercase}.counter{font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(65px,14vw,240px);line-height:.95;margin-top:1vw;font-variant-numeric:tabular-nums;text-shadow:0 5px 20px rgba(0,0,0,.25)}.sub{opacity:.75;font-size:clamp(12px,1.4vw,25px);margin-top:1vw}.status{position:fixed;right:12px;bottom:10px;font-size:11px;opacity:.35}.flash{animation:f .5s}@keyframes f{50%{transform:scale(1.035)}}
</style></head><body><div class="screen"><div class="label">Arrecadação</div><div id="counter" class="counter">R$ 0</div><div class="sub">Sua doação faz a diferença</div></div><div id="status" class="status">Conectando…</div>
<script src="app.js"></script><script>
const el=document.getElementById("counter"),st=document.getElementById("status");let current=0,aid;
function animate(target,dur){if(aid)cancelAnimationFrame(aid);let start=current,t0=performance.now();function f(now){let p=Math.min(1,(now-t0)/Math.max(80,dur));let e=1-Math.pow(1-p,3);current=start+(target-start)*e;el.textContent=money(current);if(p<1)aid=requestAnimationFrame(f);else current=target}aid=requestAnimationFrame(f)}
if(!configured())st.textContent="⚠️ Configure o Supabase";else poll(s=>{animate(Number(s.value),Number(s.speed));st.textContent="● AO VIVO";el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")});
</script></body></html>
